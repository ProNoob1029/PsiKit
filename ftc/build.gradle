plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
    id 'maven-publish'
}

group = "org.psilynx.psikit"
version = "0.2.0-beta1"

android {
    namespace 'org.psilynx.psikit.ftc'
    compileSdk 30

    defaultConfig {
        minSdk 24

        testInstrumentationRunner "android.support.test.runner.AndroidJUnitRunner"
        consumerProguardFiles "consumer-rules.pro"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    packaging {
        resources.excludes.addAll(
                "LICENSE.md",
                "ThirdPartyNotices.txt",
                "META-INF/MANIFEST.MF"
        )
    }
}

afterEvaluate {
    publishing {
        publications {
            maven(MavenPublication) {
                groupId = "org.psilynx.psikit"
                artifactId = "ftc"
                version = "0.2.0-beta1"

                from components.release

            }
        }

        repositories {
            def dairyReleaseUsername = providers.gradleProperty("dairyReleaseUsername").orNull
            def dairyReleasePassword = providers.gradleProperty("dairyReleasePassword").orNull
            if (dairyReleaseUsername != null && dairyReleasePassword != null) {
                maven {
                    name = "dairyRelease"
                    url = uri("https://repo.dairy.foundation/releases")

                    credentials {
                        username = dairyReleaseUsername
                        password = dairyReleasePassword
                    }

                    authentication {
                        basic(BasicAuthentication)
                    }
                }
            }
        }
    }
}


repositories {
    google()
    maven { url = 'https://frcmaven.wpi.edu/artifactory/release/' }
    mavenCentral()
    def dairyPrivateUsername = providers.gradleProperty("dairyPrivateUsername").orNull
    def dairyPrivatePassword = providers.gradleProperty("dairyPrivatePassword").orNull
    if (dairyPrivateUsername != null && dairyPrivatePassword != null) {
        maven {
            name = "dairyPrivate"
            url = uri("https://repo.dairy.foundation/private")

            credentials {
                username = dairyPrivateUsername
                password = dairyPrivatePassword
            }

            authentication {
                basic(BasicAuthentication)
            }
        }
    }
    maven { url "https://repo.dairy.foundation/releases" }
}

